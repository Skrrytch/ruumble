# Machbarkeitstest S1: Mumble-Server v1.6.870 mit Ice.
# Ice ist hier NUR für den Test auf 127.0.0.1 veröffentlicht; im Betrieb bleibt 6502 intern (ADR-0008).
services:
  mumble:
    image: mumblevoip/mumble-server:v1.6.870
    environment:
      MUMBLE_CONFIG_ICE: '"tcp -h 0.0.0.0 -p 6502"'
      MUMBLE_CONFIG_ICESECRETREAD: s1-read-secret
      MUMBLE_CONFIG_ICESECRETWRITE: s1-write-secret-only-for-setup
      MUMBLE_CONFIG_REGISTERNAME: Musterhaus
      MUMBLE_CONFIG_USERS: "200"
      MUMBLE_CONFIG_MESSAGEBURST: "50"
      MUMBLE_CONFIG_MESSAGELIMIT: "50"
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"  # nur Test: viele Bot-Verbindungen von einer IP
    ports:
      - "127.0.0.1:64738:64738/tcp"
      - "127.0.0.1:64738:64738/udp"
      - "127.0.0.1:6502:6502"
