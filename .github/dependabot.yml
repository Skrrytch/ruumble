# Weekly dependency updates as pull requests, grouped so there are few of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Ice must match the Mumble interface (slice2js and ice are updated together, by hand)
      - dependency-name: ice
      - dependency-name: slice2js
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
