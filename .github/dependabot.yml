# Weekly dependency updates as pull requests, grouped so there are few of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Ice must match the Mumble interface (slice2js and ice are updated together, by hand)
      - dependency-name: ice
      - dependency-name: slice2js
      # a new TypeScript major needs svelte-check support first: planned by hand
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # the Node major goes together with .nvmrc and engines (CI tests that version), planned by hand;
      # node:22-bookworm-slim is a floating tag, every image build gets the current 22.x anyway
      - dependency-name: node
        update-types: [version-update:semver-major]
