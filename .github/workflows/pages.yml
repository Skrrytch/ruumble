name: Demo

# Web UI against the mock (simulated Mumble server with sample data) on GitHub Pages: web `build:demo`.
# Deployed for every release tag, so the demo shows the released version; manually for a fix in between.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @ruumble/web build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v5
