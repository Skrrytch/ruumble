name: Live-Tests

# Real Mumble servers and headless Mumble clients with the Ruumble plugin (web/e2e-live).
# Catches behavioural changes in new Mumble versions that a diff of the interface files does not show.
# Runs weekly, manually and after a new Mumble release (triggered by mumble-release-watch).
on:
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:
    inputs:
      mumble:
        description: "nur diese Server-Version testen (Docker-Tag von mumblevoip/mumble-server, z. B. v1.6.870); leer = Standardliste"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    name: Server ${{ matrix.server }} · Client ${{ matrix.client }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # manually or after a new release: only the given version, otherwise the default list
        server: ${{ fromJSON(inputs.mumble != '' && format('["{0}"]', inputs.mumble) || '["v1.5.735","v1.6.870","latest"]') }}
        client: [ubuntu]
        include:
          - { server: v1.6.870, client: debian }
          - { server: v1.6.870, client: fedora }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ice stubs of the service: also used by web/e2e-live/mumble-admin.ts (registering, textures)
      - run: pnpm -F @ruumble/bridge gen
      - name: Plugin bauen
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build -j
      - name: Client-Image
        run: docker build -t ruumble-client-${{ matrix.client }} -f tools/live-test/clients/Dockerfile.${{ matrix.client }} tools/live-test/clients
      - name: Test-Werkzeuge (Ice-Stubs, Mumble.proto)
        working-directory: tools/live-test
        run: pnpm install --frozen-lockfile && pnpm gen
      - name: Lokaler Stack
        env:
          MUMBLE_VERSION: ${{ matrix.server }}
        run: |
          docker compose -f deploy/local/docker-compose.yml up -d --build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz | grep -q '"ice":"ok"' && break; sleep 2; done
          curl -s http://127.0.0.1:8080/healthz
          (cd tools/live-test && node src/setup.cjs)
      - run: pnpm -F @ruumble/web exec playwright install --with-deps chromium
      - name: Live-Tests
        env:
          RUUMBLE_CLIENT: ${{ matrix.client }}
        run: pnpm -F @ruumble/web exec playwright test -c playwright.live.config.ts
      - name: Protokolle bei Fehler
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --no-color > deploy/local/out/compose.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.server }}-${{ matrix.client }}
          path: |
            web/test-results-live
            deploy/local/out

