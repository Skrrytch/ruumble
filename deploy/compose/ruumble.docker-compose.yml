# Ruumble: a Mumble server as an office building (https://github.com/Skrrytch/ruumble)
# Accesses Mumble via Ice read-only. Reachable only in the home network (bound to the LAN address).
services:
    ruumble:
        image: ruumble:0.11.0
        container_name: ruumble
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 256M
        environment:
            ICE_HOST: mumble-server
            ICE_SECRET_READ_FILE: /run/secrets/ice_read
            PUBLIC_URL: http://<LAN-IP>:64080
            ADDRESS_CHECK: enforce
            # HTTPS behind a reverse proxy (docs/operations.md): instead of the two lines above
            # PUBLIC_URL: https://ruumble.example.com
            # ADDRESS_CHECK: warn
            # TRUST_PROXY: "true"
        secrets:
            - ice_read
        volumes:
            - ruumble-data:/data
        networks:
            - mumble-network
            # - homeserver-network   # network of the reverse proxy
        ports:
            # remove with HTTPS, unless plain HTTP on the LAN should stay available
            - <LAN-IP>:64080:64080

secrets:
    ice_read:
        file: ../mumble/secrets/ice_read

volumes:
    ruumble-data:
        name: ruumble-data

networks:
    mumble-network:
        external: true
    # homeserver-network:
    #     external: true
