# Mumble server and Ruumble in one Compose file, for a new setup (https://github.com/Skrrytch/ruumble).
# Nothing to edit. In this folder: ./setup.sh (creates the Ice secrets), then docker compose up -d.
# Last step: add a line "ruumble: http://<address of this server>:64080" to the description of the
# root channel in Mumble. Guide: docs/operations.md
services:
    mumble-server:
        image: mumblevoip/mumble-server:v1.6.870
        container_name: mumble-server
        restart: unless-stopped
        environment:
            # Ice only inside the Compose network (port 6502 is not published); Ruumble only gets the read secret
            MUMBLE_CONFIG_ICE: '"tcp -h 0.0.0.0 -p 6502"'
            # optional: welcome message with a link to Ruumble (plugins cannot show links)
            # MUMBLE_CONFIG_WELCOMETEXT: >-
            #     "Welcome! <a href='http://<address>:64080'><b>Open the building (Ruumble)</b></a>"
        secrets:
            - source: ice_read
              target: MUMBLE_CONFIG_ICESECRETREAD
            - source: ice_write
              target: MUMBLE_CONFIG_ICESECRETWRITE
        volumes:
            - mumble-data:/data
        ports:
            - 64738:64738
            - 64738:64738/udp

    ruumble:
        image: ghcr.io/skrrytch/ruumble:0.28.0
        container_name: ruumble
        restart: unless-stopped
        depends_on:
            - mumble-server
        environment:
            ICE_HOST: mumble-server
            ICE_SECRET_READ_FILE: /run/secrets/ice_read
            ADDRESS_CHECK: enforce
        secrets:
            - ice_read
        volumes:
            - ruumble-data:/data
        ports:
            # Plain HTTP belongs in a LAN or VPN (the internet only through HTTPS): on a server with a public address,
            # bind it to the LAN/VPN address instead, e.g. "192.168.1.10:64080:64080"
            - 64080:64080

secrets:
    ice_read:
        file: ./secrets/ice_read
    ice_write:
        file: ./secrets/ice_write

volumes:
    mumble-data:
        name: mumble-data
    ruumble-data:
        name: ruumble-data
